name: "railflow"
version: "1.0.0"
config-version: 2

profile: "railflow"

model-paths:
  - "models"

test-paths:
  - "tests"

macro-paths:
  - "macros"

analysis-paths:
  - "analyses"

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  railflow:

    staging:
      +materialized: view
      +schema: staging
      +tags:
        - staging

    intermediate:
      +materialized: view
      +schema: intermediate
      +tags:
        - intermediate

    marts:
      +materialized: table
      +schema: marts
      +tags:
        - mart